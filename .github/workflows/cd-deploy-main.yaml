name: CD deploy main

permissions:
  contents: read

on:
  workflow_run:
    workflows: ['Build and Push Docker Image']
    branches: [main]
    types: [completed]

jobs:
  deploy-main:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        run: |
          curl -s -X POST \
            "${{ secrets.COOLIFY_BASE_URL }}/api/v1/deploy?uuid=${{ secrets.COOLIFY_SERVER_UUID }}&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Content-Type: application/json"
