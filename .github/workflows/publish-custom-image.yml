name: Publish Custom Image

# Builds a Docker image that layers our autocomplete.js overlay on top of the
# official twentycrm/twenty image, publishes it to GHCR, then tells Coolify
# to redeploy the server and worker apps.
#
# Image naming
# ------------
# Immutable: ghcr.io/u2giants/twenty/twenty-custom:sha-<commit>
# Moving:    ghcr.io/u2giants/twenty/twenty-custom:main   (always = latest main)
#
# Coolify apps driven by this workflow
# -------------------------------------
# twenty-server  uuid: rd261bt0wy7ifjrkoe1tkl92
# twenty-worker  uuid: pkhhmt4r7n0xt25jmmlkkfi8
# Both are configured in Coolify as dockerimage build-pack pointing at
# ghcr.io/u2giants/twenty/twenty-custom:main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/u2giants/twenty/twenty-custom
  SERVER_UUID: rd261bt0wy7ifjrkoe1tkl92
  WORKER_UUID: pkhhmt4r7n0xt25jmmlkkfi8

jobs:
  build-and-publish:
    name: Build Overlay Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          echo "sha_tag=sha-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "image=${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.custom
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:main
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}

      - name: Trigger Coolify deploy – server
        run: |
          curl -fsSL -X GET \
            "${{ secrets.COOLIFY_BASE_URL }}/api/v1/applications/${SERVER_UUID}/start" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Accept: application/json"

      - name: Trigger Coolify deploy – worker
        run: |
          curl -fsSL -X GET \
            "${{ secrets.COOLIFY_BASE_URL }}/api/v1/applications/${WORKER_UUID}/start" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Accept: application/json"
