name: Publish Custom Image

# Builds the Twenty frontend, packages it into a Docker image on top of the
# official twentycrm/twenty base, and publishes it to GHCR.
# After the image is published, Coolify is asked to redeploy the server and
# worker apps so the new image goes live and a deployment record appears in
# Coolify's deployment history.
#
# Image naming
# ------------
# Immutable: ghcr.io/u2giants/twenty/twenty-custom:sha-<commit>
# Moving:    ghcr.io/u2giants/twenty/twenty-custom:main   (always = latest main)
#
# Coolify apps driven by this workflow
# -------------------------------------
# twenty-server  uuid: rd261bt0wy7ifjrkoe1tkl92
# twenty-worker  uuid: pkhhmt4r7n0xt25jmmlkkfi8
# Both are configured in Coolify as dockerimage build-pack pointing at
# ghcr.io/u2giants/twenty/twenty-custom:main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/u2giants/twenty/twenty-custom
  SERVER_UUID: rd261bt0wy7ifjrkoe1tkl92
  WORKER_UUID: pkhhmt4r7n0xt25jmmlkkfi8

jobs:
  build-and-publish:
    name: Build Frontend and Publish Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Get Yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> "${GITHUB_OUTPUT}"

      - name: Cache Yarn packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build twenty-front
        run: npx nx build twenty-front
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          echo "sha_tag=sha-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "image=${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.custom
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:main
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}

      - name: Trigger Coolify deploy – server
        run: |
          curl -fsSL -X GET \
            "${{ secrets.COOLIFY_BASE_URL }}/api/v1/applications/${SERVER_UUID}/start" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Accept: application/json"

      - name: Trigger Coolify deploy – worker
        run: |
          curl -fsSL -X GET \
            "${{ secrets.COOLIFY_BASE_URL }}/api/v1/applications/${WORKER_UUID}/start" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Accept: application/json"
